name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Add user binaries to PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential fd-find gzip ripgrep unzip

      - name: Install tree-sitter CLI
        run: |
          curl --fail --location --output /tmp/tree-sitter.gz \
            https://github.com/tree-sitter/tree-sitter/releases/download/v0.27.0/tree-sitter-linux-x64.gz
          echo "20a1f39ec1c45f2211492dcb8881c802b643b554bb196869a29ac3778277fa77  /tmp/tree-sitter.gz" \
            | sha256sum --check --status
          gzip --decompress --stdout /tmp/tree-sitter.gz > "$HOME/.local/bin/tree-sitter"
          chmod +x "$HOME/.local/bin/tree-sitter"

      - name: Validate shell syntax
        run: bash -n scripts/*.sh tests/*.sh

      - name: Install configuration and Neovim 0.12.3
        run: make install

      - name: Run doctor
        run: make doctor

      - name: Run isolated smoke tests
        run: make test
